# Render Blueprint: one web service plus one Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: shopify-salesforce-sync
    runtime: node
    region: oregon
    # Not "free": free services sleep, Shopify webhooks time out after 5s,
    # and Shopify deletes subscriptions that keep failing.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-salesforce-sync-db
          property: connectionString

      # Go-live switches, managed in the Render dashboard (sync: false) so a
      # Blueprint sync never resets them. Unset means the safe default:
      # SALESFORCE_MODE=dry_run, PROVIDER_ID_STRATEGY=none.
      - key: SALESFORCE_MODE
        sync: false
      - key: PROVIDER_ID_STRATEGY
        sync: false
      - key: PROVIDER_ID_METAFIELD
        sync: false
      - key: SHOPIFY_LINE_OF_BUSINESS
        value: Alpha BioMed

      # Protects /admin endpoints. Render generates a random value.
      - key: ADMIN_TOKEN
        generateValue: true

      # Secrets: Render asks for these when the Blueprint is created.
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SF_LOGIN_URL
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      # GoHighLevel sub-accounts (leads): Private Integration token + Location ID
      - key: GHL_ABM_TOKEN
        sync: false
      - key: GHL_ABM_LOCATION_ID
        sync: false
      - key: GHL_SYNC_TOKEN
        sync: false
      - key: GHL_SYNC_LOCATION_ID
        sync: false
      # Secret for the GHL Workflow webhook URL; Render generates it.
      - key: GHL_WEBHOOK_SECRET
        generateValue: true
      - key: LEAD_SYNC_ENABLED
        sync: false

databases:
  - name: shopify-salesforce-sync-db
    region: oregon
    plan: basic-256mb
    databaseName: shopify_sync
    user: shopify_sync
    # Holds customer data: reachable only from services inside Render.
    ipAllowList: []
